<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book this room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#0a1633; --muted:#5b6785; --line:#dfe5f2;
  --brand:#005aff; --brand-ink:#ffffff; --tile:#f3f6fc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07122b; --ink:#eef2fb; --muted:#9aa6c4; --line:#1d2b4f; --tile:#0f1c3d; --brand:#3d82ff;
}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:32px 22px 28px;min-height:100%;display:flex;flex-direction:column;gap:28px}
.site{color:var(--muted);font-size:15px;margin:0}
h1{font-size:clamp(44px,13vw,64px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
p.lead{margin:0;font-size:17px;color:var(--muted);line-height:1.45}
.durations{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.durations button{appearance:none;border:2px solid transparent;background:var(--tile);color:var(--ink);
  border-radius:14px;padding:18px 12px;font:600 20px/1 Figtree,system-ui,sans-serif;cursor:pointer}
.durations button[aria-pressed="true"]{border-color:var(--brand);background:var(--bg);color:var(--brand)}
button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.when{font-size:15px;color:var(--muted);margin:-14px 0 0;min-height:1.4em}
.go{display:block;text-align:center;text-decoration:none;background:var(--brand);color:var(--brand-ink);
  font-weight:800;font-size:19px;padding:20px;border-radius:16px}
.alt{display:block;text-align:center;color:var(--muted);font-size:15px;margin-top:12px}
.err{background:var(--tile);border-radius:14px;padding:18px;line-height:1.5}
footer{margin-top:auto;font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ---- Room list: add new rooms here ----
// key = what goes in the QR code URL (?room=key)
// email = the room's resource mailbox (find it in Outlook > Room Finder, or the room's contact card)
const ROOMS = {
  washington: { name: "Washington", site: "Aztec West", email: "Rm_GB_BRS_2091326@nokia.com" },
  saopaulo:   { name: "São Paulo",  site: "Aztec West", email: "Rm_GB_BRS_2091329@nokia.com" }
};
const DURATIONS = [15, 30, 60, 90];

const app = document.getElementById("app");
const key = (new URLSearchParams(location.search).get("room") || "").toLowerCase();
const room = ROOMS[key];

if (!room) {
  app.innerHTML = `<h1>Room not found</h1>
    <div class="err">This QR code doesn't match a room. Book from the Teams calendar instead, or let the office team know this sign needs fixing.</div>`;
} else {
  document.title = `Book ${room.name}`;
  let mins = 30;

  app.innerHTML = `
    <div>
      <p class="site">${room.site}</p>
      <h1>${room.name}</h1>
    </div>
    <p class="lead">How long do you need it? Booking starts now and opens in Teams for you to send.</p>
    <div class="durations" role="group" aria-label="Duration">
      ${DURATIONS.map(m => `<button type="button" data-m="${m}">${m < 60 ? m + " min" : (m/60) + " hr"}</button>`).join("")}
    </div>
    <p class="when" id="when"></p>
    <div>
      <a class="go" id="teams" href="#">Book in Teams</a>
      <a class="alt" id="outlook" href="#">Teams not opening? Book in Outlook</a>
    </div>
    <footer>If the room's already taken, it'll decline the request automatically and you'll get an email.</footer>`;

  const fmt = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function update() {
    const start = new Date();
    start.setSeconds(0, 0);
    start.setMinutes(Math.floor(start.getMinutes() / 5) * 5); // round down to 5 min
    const end = new Date(start.getTime() + mins * 60000);
    const subject = `${room.name} (${room.site}) – quick booking`;

    const teams = new URL("https://teams.microsoft.com/l/meeting/new");
    teams.searchParams.set("subject", subject);
    teams.searchParams.set("attendees", room.email);
    teams.searchParams.set("startTime", start.toISOString());
    teams.searchParams.set("endTime", end.toISOString());

    const outlook = new URL("https://outlook.office.com/calendar/action/compose");
    outlook.searchParams.set("subject", subject);
    outlook.searchParams.set("to", room.email);
    outlook.searchParams.set("startdt", start.toISOString());
    outlook.searchParams.set("enddt", end.toISOString());

    document.getElementById("teams").href = teams.toString();
    document.getElementById("outlook").href = outlook.toString();
    document.getElementById("when").textContent = `${fmt(start)} – ${fmt(end)}`;
    document.querySelectorAll(".durations button").forEach(b =>
      b.setAttribute("aria-pressed", String(+b.dataset.m === mins)));
  }

  document.querySelector(".durations").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    mins = +b.dataset.m; update();
  });
  // refresh times right before opening, in case the page sat open a while
  ["teams","outlook"].forEach(id => document.getElementById(id).addEventListener("click", update));
  update();
}
</script>
</body>
</html>
